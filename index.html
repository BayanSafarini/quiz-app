<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link rel="stylesheet" href="./css/style.css" />
    <!-- <link rel="stylesheet" href="./css/test.css" /> -->
  </head>
  <body>
    <main>
      <h1 id="quiz-title" class="quiz-title">Test Your Knowledge</h1>

      <section id="welcome-page" class="welcome-page">
        <h2 id="welcome-page-title" class="welcome-page__title"></h2>
        <p id="welcome-page-description" class="welcome-page__description"></p>
        <button id="welcome-page-start" class="welcome-page__start"></button>
      </section>
      <section id="quiz" class="quiz">
        <h2 id="quiz-question-number" class="quiz__question-number"></h2>
        <p id="quiz-question" class="quiz__question"></p>
        <button id="quiz-choice-1" class="quiz__choice"></button>
        <button id="quiz-choice-2" class="quiz__choice"></button>
        <button id="quiz-choice-3" class="quiz__choice"></button>
        <button id="quiz-choice-4" class="quiz__choice"></button>
        <div id="quiz-footer" class="quiz__footer">
          <button id="quiz-previous" class="quiz__prev"></button>
          <button id="quiz-next" class="quiz__next"></button>
        </div>
        <p id="quiz-message" class="quiz__message"></p>
      </section>
      <section id="quiz-result" class="quiz-result">
        <h2 id="quiz-result-title" class="quiz-result__title"></h2>
        <p id="quiz-result-score" class="quiz-result__score"></p>
        <button id="quiz-result-review" class="quiz-result__review"></button>
        <button id="quiz-result-restart" class="quiz-result__restart"></button>
        <button id="quiz-result-home" class="quiz-result__home"></button>
      </section>
      <section id="quiz-review" class="quiz-review">
        <h2 id="quiz-review-title" class="quiz-review__title"></h2>
        <ul id="quiz-review-list" class="quiz-review__list"></ul>
        <button id="quiz-review-restart" class="quiz-review__restart"></button>
        <button id="quiz-review-home" class="quiz-review__home"></button>
      </section>
    </main>
    <script src="./js/app.js"></script>
  </body>
</html>
